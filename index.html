<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Structured Mastery — 89</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.loading{min-height:100vh;display:grid;place-items:center}.loading div{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:20px 24px;box-shadow:0 4px 18px #0f172a0d}</style>
</head>
<body><div class="loading"><div>Loading PSLE Science Structured Mastery…</div></div>
<script>
(async()=>{
  try{
    const res=await fetch('app.html?v=recall-progress-1',{cache:'no-cache'});
    if(!res.ok) throw new Error('Could not load app.html');
    let html=await res.text();
    const patch=`<style>
.exact-progress{margin:10px 0 2px;padding:11px 13px;border:1px solid #cbd5e1;border-radius:13px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.exact-progress.mastered{background:#dcfce7;border:2px solid #16a34a}
.exact-left{min-width:0}.exact-title{font-size:13px;font-weight:800;color:#334155}.exact-progress.mastered .exact-title{color:#166534}
.exact-dots{display:flex;gap:6px;margin-top:6px}.exact-dot{width:18px;height:18px;border-radius:50%;background:#e2e8f0;border:2px solid #cbd5e1}.exact-dot.done{background:#22c55e;border-color:#15803d}
.exact-count{font-size:15px;font-weight:900;color:#475569;white-space:nowrap}.exact-progress.mastered .exact-count{color:#166534;font-size:16px}.exact-note{font-size:11px;color:#64748b;margin-top:5px}
<\/style>
<script>
(()=>{
  const filter=document.getElementById('bankFilter');
  const search=document.getElementById('bankSearch');
  const bankEl=document.getElementById('bank');
  if(!filter||!search||!bankEl) return;

  filter.innerHTML='<option value="all">All 89</option><option value="red">🔴 Focus</option><option value="green">🟢 Already Good</option><option value="amber">🟠 Learning</option>';
  filter.title='Filter by current priority';
  filter.style.cssText='width:100%;padding:9px 10px;border:2px solid #cbd5e1;border-radius:10px;font:inherit;font-size:13px;background:#fff';

  const row=document.createElement('div');
  row.style.cssText='display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;margin-top:8px';
  const label=document.createElement('label');
  label.htmlFor='bankFilter';
  label.textContent='Show:';
  label.style.cssText='font-size:12px;font-weight:800;color:#475569';
  row.append(label,filter);
  bankEl.parentNode.insertBefore(row,bankEl);

  window.bank=function(){
    const f=filter.value||'all';
    const q=(search.value||'').trim().toLowerCase();
    const cur=current();
    const html=BANK.map((e,i)=>{
      const p=priority(i);
      if(f!=='all'&&p!==f)return'';
      if(q){const num=String(i+1),topic=e.topic.toLowerCase();if(!num.includes(q)&&!topic.includes(q))return'';}
      let rowClass=p==='red'?'redrow':p==='green'?'greenrow':'amberrow';
      if(i===cur)rowClass+=' currentrow';
      return '<div class="row '+rowClass+'" data-i="'+i+'" title="'+esc(labelPriority(p))+'"><div class="rownum">'+(i+1)+'</div><div class="topicname">'+esc(e.topic)+'</div></div>';
    }).join('');
    bankEl.innerHTML=html||'<div class="small" style="padding:16px">No concepts match this filter.</div>';
    bankEl.querySelectorAll('.row[data-i]').forEach(r=>r.onclick=()=>{
      const i=Number(r.dataset.i);let idx=order.indexOf(i);
      if(idx<0){order=[i,...order];idx=0;}
      pos=idx;render();
      if(window.innerWidth<981)window.scrollTo({top:0,behavior:'smooth'});
    });
  };
  filter.onchange=window.bank;
  search.oninput=window.bank;

  const teacherStrip=document.querySelector('.teacher-strip');
  const progress=document.createElement('div');
  progress.id='exactRecallProgress';
  progress.className='exact-progress';
  progress.setAttribute('aria-live','polite');
  if(teacherStrip) teacherStrip.insertAdjacentElement('afterend',progress);

  function updateRecallProgress(){
    if(!progress) return;
    const i=current();
    const x=rec(i);
    const credited=Math.min(3,new Set(x.phraseDates||[]).size);
    const mastered=credited>=3;
    progress.classList.toggle('mastered',mastered);
    const dots=[0,1,2].map(n=>'<span class="exact-dot '+(n<credited?'done':'')+'" aria-hidden="true"></span>').join('');
    progress.innerHTML='<div class="exact-left"><div class="exact-title">Exact Recall Progress</div><div class="exact-dots">'+dots+'</div><div class="exact-note">One correct Exact Recall is credited per day.</div></div><div class="exact-count">'+(mastered?'✅ MASTERED — 3 / 3':'Correct: '+credited+' / 3')+'</div>';
  }

  const originalRender=render;
  render=function(){originalRender();updateRecallProgress();};
  const originalSetPane=setPane;
  setPane=function(p){originalSetPane(p);updateRecallProgress();};
  const checkBtn=document.getElementById('checkPhrase');
  if(checkBtn) checkBtn.addEventListener('click',()=>setTimeout(updateRecallProgress,0));

  window.bank();
  updateRecallProgress();
})();
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div>Unable to load the revision page. Please refresh.</div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
