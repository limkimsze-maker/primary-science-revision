<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Structured Mastery — 97</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.loading{min-height:100vh;display:grid;place-items:center}.loading div{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:20px 24px;box-shadow:0 4px 18px #0f172a0d}</style>
</head>
<body><div class="loading"><div>Loading PSLE Science Structured Mastery…</div></div>
<script>
(async()=>{
  try{
    const res=await fetch('app.html?v=full-de-sr-lr-2',{cache:'no-cache'});
    if(!res.ok) throw new Error('Could not load app.html');
    let html=await res.text();

    const EXPERIMENT_BANK=[
      {
        id:90,
        topic:'Experiment — keep variable the same',
        phrasePrompt:'Why keep X the same?',
        phrase:'To ensure that only the changed variable affects the measured variable, making it a fair test.',
        applicationQuestion:'A pupil investigates whether the amount of fertiliser affects the height of plants. Why should the amount of water given to each plant be kept the same?',
        rubric:['The amount of water is kept constant','Only the amount of fertiliser is the changed variable','Plant height is the measured variable','Keeping other variables constant makes it a fair test'],
        modelApplicationAnswer:'The amount of water should be kept the same to ensure that only the amount of fertiliser, the changed variable, affects the height of the plants, the measured variable, making it a fair test.'
      },
      {
        id:91,
        topic:'Experiment — repeat experiment',
        phrasePrompt:'Why repeat the experiment?',
        phrase:'To improve the reliability of the results and reduce the effect of random errors.',
        applicationQuestion:'A pupil measures the time taken for a toy car to travel down the same ramp. Explain why the experiment should be repeated several times.',
        rubric:['Repeating improves reliability','Repeating reduces the effect of random errors'],
        modelApplicationAnswer:'The experiment should be repeated to improve the reliability of the results and reduce the effect of random errors.'
      },
      {
        id:92,
        topic:'Experiment — calculate average',
        phrasePrompt:'Why calculate an average?',
        phrase:'To reduce the effect of unusual readings and make the results more reliable.',
        applicationQuestion:'A pupil repeats an experiment five times and obtains slightly different readings. Explain why an average of the readings should be calculated.',
        rubric:['An average reduces the effect of unusual readings','The results become more reliable'],
        modelApplicationAnswer:'An average should be calculated to reduce the effect of unusual readings and make the results more reliable.'
      },
      {
        id:93,
        topic:'Experiment — identical plants/objects',
        phrasePrompt:'Why use identical plants/objects?',
        phrase:'So differences in the measured result are due to the changed variable rather than differences between the specimens.',
        applicationQuestion:'A pupil investigates how temperature affects seed germination. Explain why seeds of the same type and similar size should be used in all the set-ups.',
        rubric:['The specimens should be similar/identical','Differences in the measured result should be due to temperature, the changed variable','Differences should not be due to differences between the seeds/specimens'],
        modelApplicationAnswer:'Seeds of the same type and similar size should be used so that differences in germination are due to the changed temperature rather than differences between the seeds.'
      },
      {
        id:94,
        topic:'Experiment — conclusion from data',
        phrasePrompt:'What framework should I use for a conclusion from data?',
        phrase:'As __ increases/decreases, __ increases/decreases.',
        applicationQuestion:'A water plant produced 5 bubbles per minute at a low light intensity, 11 bubbles per minute at a medium light intensity and 18 bubbles per minute at a high light intensity. State the relationship between light intensity and the number of bubbles produced per minute.',
        rubric:['State the changed variable: light intensity','State the measured variable: number of bubbles produced per minute','State the correct direction of the relationship: as light intensity increases, bubbles per minute increases'],
        modelApplicationAnswer:'As the light intensity increases, the number of bubbles produced per minute increases.'
      },
      {
        id:95,
        topic:'Experiment — cause from experiment',
        phrasePrompt:'What framework should I use to explain a cause from an experiment?',
        phrase:'Since only __ was changed while the other variables were kept constant, the difference in __ was due to __.',
        applicationQuestion:'Two circuits were identical except that Circuit A had two batteries while Circuit B had one battery. Bulb A was brighter than Bulb B. Explain how the experiment shows that the number of batteries affected the brightness of the bulb.',
        rubric:['Only the number of batteries was changed','Other variables were kept constant','Brightness was the measured result','The difference in brightness was due to the number of batteries'],
        modelApplicationAnswer:'Since only the number of batteries was changed while the other variables were kept constant, the difference in bulb brightness was due to the number of batteries.'
      },
      {
        id:96,
        topic:'Experiment — evidence question',
        phrasePrompt:'What should I do for an evidence question?',
        phrase:'Quote the actual result first, then explain the science behind that result.',
        applicationQuestion:'Plant X was placed in brighter light and produced 20 bubbles per minute. Plant Y produced 8 bubbles per minute. Explain, using evidence from the results, why Plant X had a higher rate of photosynthesis.',
        rubric:['Quote/compare the actual result: 20 bubbles per minute versus 8 bubbles per minute','Explain that Plant X received more light','Light is needed for photosynthesis / more photosynthesis took place'],
        modelApplicationAnswer:'Plant X produced 20 bubbles per minute compared with Plant Y, which produced 8 bubbles per minute. Plant X received more light, which is needed for photosynthesis, so it had a higher rate of photosynthesis.'
      },
      {
        id:97,
        topic:'Experiment — compare question',
        phrasePrompt:'What should I do for a compare question?',
        phrase:'State what happened to A compared with B, then explain why.',
        applicationQuestion:'Two identical wet cloths were placed under the same conditions except that moving air blew over Cloth A while the air around Cloth B was still. Cloth A dried in 40 minutes while Cloth B dried in 70 minutes. Compare the results and explain why.',
        rubric:['State the comparison: Cloth A dried faster / took less time than Cloth B','Moving air carries water vapour away from the surface','Evaporation occurs faster'],
        modelApplicationAnswer:'Cloth A dried faster than Cloth B. The moving air carried water vapour away from Cloth A, allowing evaporation to occur faster.'
      }
    ];

    const bankInject='BANK.push(...'+JSON.stringify(EXPERIMENT_BANK)+');\n';
    html=html.replace('const KEY=',bankInject+'const KEY=');

    html=html.replaceAll('Array(89).keys()','Array(BANK.length).keys()');
    html=html.replaceAll('for(let i=0;i<89;i++)','for(let i=0;i<BANK.length;i++)');
    html=html.replaceAll('ps/89*100','ps/BANK.length*100');
    html=html.replaceAll('as/89*100','as/BANK.length*100');
    html=html.replace('bank:89','bank:BANK.length');
    html=html.replace('psle-science-89-structured-progress.json','psle-science-97-structured-progress.json');

    html=html.replace('89 concepts · VERBATIM phrase mastery + application · weak concepts recur more often','97 patterns · 89 Science explanations + 8 experiment frameworks · memorisation + application');
    html=html.replaceAll('All 89','All 97');
    html=html.replace('id="amberCount">89','id="amberCount">97');
    html=html.replace('Type the VERBATIM 89-bank explanation here...','Type the VERBATIM mastery sentence/framework here...');
    html=html.replace('the target sentence is copied VERBATIM from the original 89-bank HTML.','the target sentence/framework is learned VERBATIM.');
    html=html.replace('core 89-bank explanation is never rewritten','core mastery explanation/framework is never rewritten');
    html=html.replace('Existing progress from the earlier 89-item trainers is migrated automatically when available.','Existing 89-item progress is preserved; the 8 experiment frameworks are added alongside it.');
    html=html.replace('Use “Show Verbatim + Applied Answer” to see both.','Use “Show Full D/E → S/R → L/R Answer” to see a complete training-safe model.');

    const patch=`<style>
.ai-mark-wrap{margin-top:12px;padding:12px;border:1px solid #bfdbfe;border-radius:13px;background:#eff6ff}.ai-mark-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.ai-mark-title{font-weight:800;color:#1e3a8a}.ai-state{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#dcfce7;border:1px solid #86efac;color:#166534}.ai-mark-btn{background:#1d4ed8!important;color:#fff!important;border-color:#1d4ed8!important;font-weight:800}.ai-mark-btn:disabled{opacity:.6;cursor:wait}.ai-note{font-size:12px;color:#475569;margin-top:6px;line-height:1.4}.ai-result{margin-top:10px;padding:12px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;line-height:1.5}.ai-result.correct{background:#ecfdf5;border-color:#86efac}.ai-result.partial{background:#fff7ed;border-color:#fdba74}.ai-result.wrongai{background:#fef2f2;border-color:#fca5a5}.ai-verdict{font-weight:900;font-size:17px;margin-bottom:5px}.ai-section{margin-top:7px}.ai-section b{display:block;margin-bottom:2px}.ai-improved{margin-top:8px;padding:9px 10px;border-left:4px solid #6366f1;background:#f8fafc;border-radius:8px}.manual-label{font-size:12px;font-weight:800;color:#64748b;margin:12px 0 4px}
.exact-progress-box{margin-top:10px;padding:10px 12px;border:1px solid #c7d2fe;border-radius:12px;background:#eef2ff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.exact-progress-box.mastered{background:#dcfce7;border-color:#86efac}.exact-progress-title{font-weight:800}.exact-progress-count{font-weight:900;font-size:17px}.exact-progress-dots{display:flex;gap:5px}.exact-dot{width:18px;height:18px;border-radius:50%;border:2px solid #a5b4fc;background:#fff}.exact-dot.done{background:#22c55e;border-color:#16a34a}
.experiment-tag{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:999px;background:#dbeafe;color:#1e40af;font-size:10px;font-weight:800}
.training-banner{margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef2ff;border:1px solid #c7d2fe;color:#312e81;font-size:13px;line-height:1.45}.training-model{line-height:1.5}.tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tm-box{padding:11px;border-radius:11px;border:1px solid #dbe3ee;background:#fff}.tm-box b{display:block;margin-bottom:5px}.tm-de{border-top:5px solid #f59e0b}.tm-sr{border-top:5px solid #f97316;background:#fff7ed}.tm-lr{border-top:5px solid #8b5cf6}.tm-full{margin-top:10px;padding:12px;border-radius:12px;background:#ecfdf5;border:1px solid #86efac}.tm-full b{display:block;margin-bottom:6px;color:#065f46}.tm-keywords{margin-top:10px;padding:9px 10px;border-radius:10px;background:#f8fafc;border:1px solid #cbd5e1}.tm-verbatim{margin-top:8px;padding:10px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;font-weight:800}.tm-direct{margin-top:10px;padding:12px;border-radius:12px;background:#ecfdf5;border:1px solid #86efac}.criteria-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.criterion{font-size:12px;font-weight:800;padding:5px 7px;border-radius:999px;border:1px solid #cbd5e1;background:#fff}.criterion.yes{background:#dcfce7;border-color:#86efac;color:#166534}.criterion.no{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.criterion.na{background:#f1f5f9;color:#64748b}
@media(max-width:760px){.tm-grid{grid-template-columns:1fr}}
<\/style>
<script>
(()=>{
  const BASE='https://primary-science-ai-marker.limkimsze-maker.workers.dev';
  const AI_ENDPOINT=BASE+'/mark';
  const MODEL_ENDPOINT=BASE+'/training-model';
  const MODEL_CACHE_KEY='psleScience97_full_training_models_v1';
  let modelCache={};
  try{modelCache=JSON.parse(localStorage.getItem(MODEL_CACHE_KEY)||'{}')}catch(_){modelCache={}}
  const saveModelCache=()=>{try{localStorage.setItem(MODEL_CACHE_KEY,JSON.stringify(modelCache))}catch(_){}};

  const filter=document.getElementById('bankFilter');
  const search=document.getElementById('bankSearch');
  const bankEl=document.getElementById('bank');
  if(filter&&search&&bankEl){
    filter.innerHTML='<option value="all">All '+BANK.length+'</option><option value="red">🔴 Focus</option><option value="green">🟢 Already Good</option><option value="amber">🟠 Learning</option><option value="experiment">🧪 Experiment only</option>';
    filter.title='Filter by current priority';
    filter.style.cssText='width:100%;padding:9px 10px;border:2px solid #cbd5e1;border-radius:10px;font:inherit;font-size:13px;background:#fff';
    const filterRow=document.createElement('div');
    filterRow.style.cssText='display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;margin-top:8px';
    const filterLabel=document.createElement('label');
    filterLabel.htmlFor='bankFilter';filterLabel.textContent='Show:';filterLabel.style.cssText='font-size:12px;font-weight:800;color:#475569';
    filterRow.append(filterLabel,filter);
    bankEl.parentNode.insertBefore(filterRow,bankEl);
    window.bank=function(){
      const f=filter.value||'all';
      const q=(search.value||'').trim().toLowerCase();
      const cur=current();
      const rows=BANK.map((e,i)=>{
        const p=priority(i);
        const isExperiment=i>=89;
        if(f==='experiment'&&!isExperiment)return'';
        if(f!=='all'&&f!=='experiment'&&p!==f)return'';
        if(q){const num=String(i+1),topic=e.topic.toLowerCase();if(!num.includes(q)&&!topic.includes(q))return'';}
        let rowClass=p==='red'?'redrow':p==='green'?'greenrow':'amberrow';
        if(i===cur)rowClass+=' currentrow';
        const tag=isExperiment?'<span class="experiment-tag">EXP</span>':'';
        return '<div class="row '+rowClass+'" data-i="'+i+'" title="'+esc(labelPriority(p))+'"><div class="rownum">'+(i+1)+'</div><div class="topicname">'+esc(e.topic)+tag+'</div></div>';
      }).join('');
      bankEl.innerHTML=rows||'<div class="small" style="padding:16px">No concepts match this filter.</div>';
      bankEl.querySelectorAll('.row[data-i]').forEach(r=>r.onclick=()=>{
        const i=Number(r.dataset.i);let idx=order.indexOf(i);
        if(idx<0){order=[i,...order];idx=0;}
        pos=idx;render();
        if(window.innerWidth<981)window.scrollTo({top:0,behavior:'smooth'});
      });
    };
    filter.onchange=window.bank;search.oninput=window.bank;
  }

  const teacherStrip=document.querySelector('.teacher-strip');
  const exactBox=document.createElement('div');
  exactBox.className='exact-progress-box';
  exactBox.innerHTML='<div><div class="exact-progress-title">Exact Recall Progress</div><div class="small">One correct Exact Recall per different day counts.</div></div><div style="display:flex;align-items:center;gap:10px"><div class="exact-progress-dots"><span class="exact-dot"></span><span class="exact-dot"></span><span class="exact-dot"></span></div><div class="exact-progress-count">0 / 3</div></div>';
  if(teacherStrip) teacherStrip.insertAdjacentElement('afterend',exactBox);
  const exactCount=exactBox.querySelector('.exact-progress-count');
  const exactDots=[...exactBox.querySelectorAll('.exact-dot')];
  function updateExactProgress(){
    const n=Math.min(3,new Set(rec(current()).phraseDates||[]).size);
    exactDots.forEach((d,i)=>d.classList.toggle('done',i<n));
    exactBox.classList.toggle('mastered',n>=3);
    exactCount.textContent=n>=3?'✅ MASTERED — 3 / 3':'Correct: '+n+' / 3';
  }

  const appPane=document.getElementById('appPane');
  const appAnswer=document.getElementById('appAnswer');
  const actionRow=appPane?appPane.querySelector('.actions'):null;
  const rating=appPane?appPane.querySelector('.rating'):null;
  const modelBtn=document.getElementById('modelAppBtn');
  const modelBox=document.getElementById('modelAppBox');
  let lastMarked='';
  let aiWrap,aiBtn,aiResult;

  const trainingBanner=document.createElement('div');
  trainingBanner.className='training-banner';
  trainingBanner.innerHTML='<b>Training answer standard:</b> For <b>Explain / Why / Evidence / Compare</b>, practise the complete <b>D/E → S/R → L/R</b> chain. The S/R keeps the memorised Science explanation and its key words. For <b>State / Name / Identify</b>, answer only what is required.';
  const frame=document.querySelector('#appPane .frame');
  if(frame)frame.insertAdjacentElement('afterend',trainingBanner);

  if(actionRow){
    aiWrap=document.createElement('div');aiWrap.className='ai-mark-wrap';
    aiWrap.innerHTML='<div class="ai-mark-head"><div><div class="ai-mark-title">🤖 AI Application Marker</div><div class="ai-note">Checks required D/E → S/R → L/R and important scientific key words. Equivalent correct wording is accepted.</div></div><span class="ai-state">● AI ready</span></div><div class="actions" style="margin-top:9px"><button type="button" class="ai-mark-btn">🤖 AI Mark My Answer</button></div><div class="ai-result hide" aria-live="polite"></div>';
    actionRow.parentNode.insertBefore(aiWrap,actionRow);
    aiBtn=aiWrap.querySelector('.ai-mark-btn');aiResult=aiWrap.querySelector('.ai-result');
    aiBtn.addEventListener('click',markWithAI);
    appAnswer.addEventListener('input',()=>{if(appAnswer.value.trim()!==lastMarked){aiBtn.disabled=false;aiBtn.textContent='🤖 AI Mark My Answer';}});
  }
  if(rating){const lab=document.createElement('div');lab.className='manual-label';lab.textContent='Parent/Teacher override (optional):';rating.parentNode.insertBefore(lab,rating);}

  function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function ratingLabel(r){return {correct:'✅ Correct',de:'🟨 D/E missing',sr:'🟧 S/R missing / wrong',lr:'🟪 L/R missing',concept:'❌ Concept not known'}[r]||'AI Mark'}
  function criterionHtml(label,required,met){
    const cls=!required?'na':met?'yes':'no';
    const icon=!required?'—':met?'✓':'✗';
    return '<span class="criterion '+cls+'">'+icon+' '+label+(!required?' not required':'')+'</span>';
  }

  async function showTrainingModel(){
    const e=BANK[current()];
    const key=String(e.id);
    if(!modelBox)return;
    if(!modelBox.classList.contains('hide')){
      modelBox.classList.add('hide');
      modelBtn.textContent='Show Full D/E → S/R → L/R Answer';
      return;
    }
    modelBox.classList.remove('hide');
    modelBtn.textContent='Hide Full Model Answer';
    modelBox.className='model training-model';
    modelBox.innerHTML='<b>Building a complete PSLE-safe model…</b><div class="small" style="margin-top:5px">The memorised S/R sentence is kept intact for Science explanations.</div>';
    try{
      let data=modelCache[key];
      if(!data){
        const res=await fetch(MODEL_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conceptId:e.id,topic:e.topic,question:e.applicationQuestion,verbatim:e.phrase,rubric:e.rubric,modelAnswer:e.modelApplicationAnswer})});
        data=await res.json().catch(()=>({}));
        if(!res.ok)throw new Error(data.error||'Could not build the full model answer.');
        modelCache[key]=data;saveModelCache();
      }
      let h='<b>Memorised '+(data.isExperiment?'framework':'S/R explanation')+'</b><div class="tm-verbatim">'+safe(e.phrase)+'</div>';
      if(data.frameNeeded){
        h+='<div class="tm-grid">';
        h+='<div class="tm-box tm-de"><b>D/E — Data / Evidence</b>'+safe(data.de||'Use the relevant observation/comparison from the question.')+'</div>';
        h+='<div class="tm-box tm-sr"><b>S/R — Science / Reasoning</b>'+safe(data.sr||e.phrase)+'</div>';
        h+='<div class="tm-box tm-lr"><b>L/R — Link / Result</b>'+safe(data.lr||'Link the Science back to exactly what was asked.')+'</div>';
        h+='</div>';
        h+='<div class="tm-full"><b>✅ Full PSLE-safe model answer</b>'+safe(data.fullAnswer||e.modelApplicationAnswer)+'</div>';
      }else{
        h+='<div class="tm-direct"><b>✅ Direct answer — full D/E → S/R → L/R is not required for this question</b><br>'+safe(data.fullAnswer||e.modelApplicationAnswer)+'</div>';
      }
      if(data.keywords)h+='<div class="tm-keywords"><b>Key words to protect:</b> '+safe(data.keywords)+'</div>';
      if(data.note)h+='<div class="small" style="margin-top:7px">'+safe(data.note)+'</div>';
      modelBox.innerHTML=h;
    }catch(err){
      modelBox.innerHTML='<div class="wrong"><b>Full model temporarily unavailable.</b><br>'+safe(err.message||'Please try again.')+'</div>';
    }
  }

  if(modelBtn){modelBtn.textContent='Show Full D/E → S/R → L/R Answer';modelBtn.onclick=showTrainingModel;}

  async function markWithAI(){
    const ans=(appAnswer.value||'').trim();
    if(!ans){aiResult.className='ai-result partial';aiResult.innerHTML='<div class="ai-verdict">Write an answer first.</div>';return;}
    if(ans===lastMarked&&aiResult&&!aiResult.classList.contains('hide'))return;
    const e=BANK[current()];
    aiBtn.disabled=true;aiBtn.textContent='🤖 Marking…';aiResult.className='ai-result';aiResult.innerHTML='<div class="ai-verdict">AI is checking D/E → S/R → L/R and key words…</div>';
    try{
      const res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conceptId:e.id,topic:e.topic,question:e.applicationQuestion,answer:ans,verbatim:e.phrase,rubric:e.rubric,modelAnswer:e.modelApplicationAnswer})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data.error||'AI marker could not be reached.');
      const r=['correct','de','sr','lr','concept'].includes(data.rating)?data.rating:'concept';
      const cls=r==='correct'?'correct':(r==='de'||r==='lr'?'partial':'wrongai');
      let h='<div class="ai-verdict">'+safe(ratingLabel(r))+'</div>';
      if(data.criteria){
        h+='<div class="criteria-strip">'+criterionHtml('D/E',data.criteria.deRequired,data.criteria.deMet)+criterionHtml('S/R',data.criteria.srRequired,data.criteria.srMet)+criterionHtml('L/R',data.criteria.lrRequired,data.criteria.lrMet)+'</div>';
      }
      if(data.feedback)h+='<div class="ai-section">'+safe(data.feedback)+'</div>';
      if(data.strengths)h+='<div class="ai-section"><b>What you did well</b>'+safe(data.strengths)+'</div>';
      if(data.missing)h+='<div class="ai-section"><b>What is missing / wrong</b>'+safe(data.missing)+'</div>';
      if(data.improvedAnswer)h+='<div class="ai-improved"><b>Fuller PSLE-safe answer</b><br>'+safe(data.improvedAnswer)+'</div>';
      aiResult.className='ai-result '+cls;aiResult.innerHTML=h;lastMarked=ans;
      rateApp(r);
      rec(current()).aiLast={rating:r,feedback:data.feedback||'',missing:data.missing||'',markedAt:new Date().toISOString()};save();
      aiBtn.textContent='✓ AI Marked';
    }catch(err){
      aiResult.className='ai-result wrongai';
      aiResult.innerHTML='<div class="ai-verdict">AI marking unavailable</div><div>'+safe(err.message||'Please try again.')+'</div>';
      aiBtn.disabled=false;aiBtn.textContent='🤖 Try AI Mark Again';
    }
  }

  const originalRender=render;
  window.render=function(){
    originalRender();
    lastMarked='';
    if(aiResult)aiResult.className='ai-result hide';
    if(aiBtn){aiBtn.disabled=false;aiBtn.textContent='🤖 AI Mark My Answer';}
    if(modelBtn){modelBtn.textContent='Show Full D/E → S/R → L/R Answer';modelBtn.onclick=showTrainingModel;}
    if(modelBox){modelBox.classList.add('hide');modelBox.innerHTML='';}
    updateExactProgress();
  };
  const originalCheckPhrase=checkPhrase;
  window.checkPhrase=function(){originalCheckPhrase();updateExactProgress();};
  document.getElementById('checkPhrase').onclick=window.checkPhrase;
  updateExactProgress();if(window.bank)window.bank();
})();
<\/script>`;

    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div>Unable to load the revision page. Please refresh.</div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
