<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Structured Mastery — 89</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.loading{min-height:100vh;display:grid;place-items:center}.loading div{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:20px 24px;box-shadow:0 4px 18px #0f172a0d}</style>
</head>
<body><div class="loading"><div>Loading PSLE Science Structured Mastery…</div></div>
<script>
(async()=>{
  try{
    const res=await fetch('app.html?v=priority-filter-1',{cache:'no-cache'});
    if(!res.ok) throw new Error('Could not load app.html');
    let html=await res.text();
    const patch=`<script>
(()=>{
  const filter=document.getElementById('bankFilter');
  const search=document.getElementById('bankSearch');
  const bankEl=document.getElementById('bank');
  if(!filter||!search||!bankEl) return;

  filter.innerHTML='<option value="all">All 89</option><option value="red">🔴 Focus</option><option value="green">🟢 Already Good</option><option value="amber">🟠 Learning</option>';
  filter.title='Filter by current priority';
  filter.style.cssText='width:100%;padding:9px 10px;border:2px solid #cbd5e1;border-radius:10px;font:inherit;font-size:13px;background:#fff';

  const row=document.createElement('div');
  row.style.cssText='display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;margin-top:8px';
  const label=document.createElement('label');
  label.htmlFor='bankFilter';
  label.textContent='Show:';
  label.style.cssText='font-size:12px;font-weight:800;color:#475569';
  row.append(label,filter);
  bankEl.parentNode.insertBefore(row,bankEl);

  window.bank=function(){
    const f=filter.value||'all';
    const q=(search.value||'').trim().toLowerCase();
    const cur=current();
    const html=BANK.map((e,i)=>{
      const p=priority(i);
      if(f!=='all'&&p!==f)return'';
      if(q){const num=String(i+1),topic=e.topic.toLowerCase();if(!num.includes(q)&&!topic.includes(q))return'';}
      let rowClass=p==='red'?'redrow':p==='green'?'greenrow':'amberrow';
      if(i===cur)rowClass+=' currentrow';
      return '<div class="row '+rowClass+'" data-i="'+i+'" title="'+esc(labelPriority(p))+'"><div class="rownum">'+(i+1)+'</div><div class="topicname">'+esc(e.topic)+'</div></div>';
    }).join('');
    bankEl.innerHTML=html||'<div class="small" style="padding:16px">No concepts match this filter.</div>';
    bankEl.querySelectorAll('.row[data-i]').forEach(r=>r.onclick=()=>{
      const i=Number(r.dataset.i);let idx=order.indexOf(i);
      if(idx<0){order=[i,...order];idx=0;}
      pos=idx;render();
      if(window.innerWidth<981)window.scrollTo({top:0,behavior:'smooth'});
    });
  };
  filter.onchange=window.bank;
  search.oninput=window.bank;
  window.bank();
})();
<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div>Unable to load the revision page. Please refresh.</div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
