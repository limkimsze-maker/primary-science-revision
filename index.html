<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Structured Mastery — Gold Standard</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}.loading{min-height:100vh;display:grid;place-items:center}.loading div{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:20px 24px;box-shadow:0 4px 18px #0f172a0d}</style>
</head>
<body><div class="loading"><div>Loading gold-standard PSLE Science Structured Mastery…</div></div>
<script>
(async()=>{
  try{
    const res=await fetch('app.html?v=gold-book-v1',{cache:'no-cache'});
    if(!res.ok)throw new Error('Could not load app.html');
    let html=await res.text();

    const EXPERIMENT_BANK=[
      {id:90,topic:'Experiment — keep variable the same',phrasePrompt:'Why keep X the same?',phrase:'To ensure that only the changed variable affects the measured variable, making it a fair test.',applicationQuestion:'A pupil investigates whether the amount of fertiliser affects the height of plants. Why should the amount of water given to each plant be kept the same?',rubric:['The amount of water is kept constant','Only the amount of fertiliser is the changed variable','Plant height is the measured variable','Keeping other variables constant makes it a fair test'],modelApplicationAnswer:'The amount of water should be kept the same to ensure that only the amount of fertiliser, the changed variable, affects the height of the plants, the measured variable, making it a fair test.'},
      {id:91,topic:'Experiment — repeat experiment',phrasePrompt:'Why repeat the experiment?',phrase:'Repeat the experiment several times to obtain consistent or similar results and improve the reliability of the results.',applicationQuestion:'A pupil measures the time taken for a toy car to travel down the same ramp. Explain why the experiment should be repeated several times.',rubric:['Repeat the experiment several times','Check that repeated results are consistent or similar','Repeating improves reliability'],modelApplicationAnswer:'The experiment should be repeated several times to obtain consistent or similar results and improve the reliability of the results.'},
      {id:92,topic:'Experiment — calculate average',phrasePrompt:'Why calculate an average?',phrase:'Calculate the average of the repeated results to improve the reliability of the results.',applicationQuestion:'A pupil repeats an experiment five times and obtains slightly different readings. Explain why an average of the readings should be calculated.',rubric:['Use the repeated readings','Calculate their average','Calculating the average improves reliability'],modelApplicationAnswer:'The average of the repeated readings should be calculated to improve the reliability of the results.'},
      {id:93,topic:'Experiment — identical plants/objects',phrasePrompt:'Why use identical plants/objects?',phrase:'So differences in the measured result are due to the changed variable rather than differences between the specimens.',applicationQuestion:'A pupil investigates how temperature affects seed germination. Explain why seeds of the same type and similar size should be used in all the set-ups.',rubric:['The specimens should be similar/identical','Differences in the measured result should be due to temperature, the changed variable','Differences should not be due to differences between the seeds/specimens'],modelApplicationAnswer:'Seeds of the same type and similar size should be used so that differences in germination are due to the changed temperature rather than differences between the seeds.'},
      {id:94,topic:'Experiment — conclusion from data',phrasePrompt:'What framework should I use for a conclusion from data?',phrase:'As __ increases/decreases, __ increases/decreases.',applicationQuestion:'A water plant produced 5 bubbles per minute at a low light intensity, 11 bubbles per minute at a medium light intensity and 18 bubbles per minute at a high light intensity. State the relationship between light intensity and the number of bubbles produced per minute.',rubric:['State the changed variable: light intensity','State the measured variable: number of bubbles produced per minute','State the correct direction of the relationship'],modelApplicationAnswer:'As the light intensity increases, the number of bubbles produced per minute increases.'},
      {id:95,topic:'Experiment — cause from experiment',phrasePrompt:'What framework should I use to explain a cause from an experiment?',phrase:'Since only __ was changed while the other variables were kept constant, the difference in __ was due to __.',applicationQuestion:'Two circuits were identical except that Circuit A had two batteries while Circuit B had one battery. Bulb A was brighter than Bulb B. Explain how the experiment shows that the number of batteries affected the brightness of the bulb.',rubric:['Only the number of batteries was changed','Other variables were kept constant','Brightness was the measured result','The difference in brightness was due to the number of batteries'],modelApplicationAnswer:'Since only the number of batteries was changed while the other variables were kept constant, the difference in bulb brightness was due to the number of batteries.'},
      {id:96,topic:'Experiment — evidence question',phrasePrompt:'What should I do for an evidence question?',phrase:'Quote the actual result first, then explain the science behind that result.',applicationQuestion:'Plant X was placed in brighter light and produced 20 bubbles per minute. Plant Y produced 8 bubbles per minute. Explain, using evidence from the results, why Plant X had a higher rate of photosynthesis.',rubric:['Quote/compare the actual result: 20 bubbles per minute versus 8 bubbles per minute','Plant X received brighter light','Light is needed for photosynthesis / more photosynthesis took place'],modelApplicationAnswer:'Plant X produced 20 bubbles per minute compared with Plant Y, which produced 8 bubbles per minute. Plant X received brighter light, so more light energy could be trapped for photosynthesis and it had a higher rate of photosynthesis.'},
      {id:97,topic:'Experiment — compare question',phrasePrompt:'What should I do for a compare question?',phrase:'State what happened to A compared with B, then explain why.',applicationQuestion:'Two identical wet cloths were placed under the same conditions except that moving air blew over Cloth A while the air around Cloth B was still. Cloth A dried in 40 minutes while Cloth B dried in 70 minutes. Compare the results and explain why.',rubric:['State the comparison: Cloth A dried faster / took less time than Cloth B','Moving air carries water vapour away from the surface','Evaporation occurs faster'],modelApplicationAnswer:'Cloth A dried faster than Cloth B. The moving air carried water vapour away from Cloth A, allowing evaporation to occur faster.'}
    ];

    const GOLD_OVERRIDES={
      2:{phrase:'Chlorophyll in the leaves traps light energy for the plant to carry out photosynthesis to make food.',rubric:['Chlorophyll in the leaves traps light energy','Light energy is needed for photosynthesis','Photosynthesis allows the plant to make food'],modelApplicationAnswer:'The covered part received little or no light, so its chlorophyll could not trap as much light energy for photosynthesis. Therefore, less food was made in the covered part.'},
      3:{phrase:'More leaves provide a larger surface area to trap light, allowing more photosynthesis to take place.',rubric:['More leaves provide a larger surface area','A larger surface area traps more light','More photosynthesis can take place'],modelApplicationAnswer:'Plant X has more leaves, providing a larger surface area to trap light. Therefore, more photosynthesis can take place in Plant X.'},
      7:{phrase:'Water and mineral salts absorbed by the roots are transported through water-carrying tubes to all parts of the plant.',rubric:['Roots absorb water and mineral salts','Water-carrying tubes transport them','They are transported to all parts of the plant'],modelApplicationAnswer:'The coloured water was absorbed by the roots and transported through the water-carrying tubes to the leaves and other parts of the plant.'},
      10:{phrase:'Water is needed to activate the life processes within the seed for germination.',rubric:['Water is needed for germination','Water activates life processes within the seed','The seed can then germinate'],modelApplicationAnswer:'Seed A received water. Water is needed to activate the life processes within the seed for germination, so Seed A germinated while Seed B did not.'},
      13:{phrase:'The young plant uses food stored in the seed leaves before its leaves develop and make food.',rubric:['Seed leaves contain stored food','The young plant uses this stored food first','Later its leaves develop and make food'],modelApplicationAnswer:'The young plant used food stored in its seed leaves before its leaves developed and could make food, so it could grow at first without light.'},
      14:{phrase:'Seeds are dispersed to prevent overcrowding and reduce competition for mineral salts, water, sunlight and space.',rubric:['Seed dispersal prevents overcrowding','It reduces competition','Resources include mineral salts, water, sunlight and space'],modelApplicationAnswer:'The seeds are dispersed away from the parent plant to prevent overcrowding and reduce competition for mineral salts, water, sunlight and space.'},
      15:{phrase:'Pollination is the transfer of pollen grains from the anther to the stigma of the same flower or another flower of the same type.',rubric:['Pollen grains are transferred','From anther to stigma','The flower is the same flower or another flower of the same type'],modelApplicationAnswer:'Pollination occurred because pollen grains were transferred from the anther to the stigma of another flower of the same type.'},
      16:{phrase:'Fertilisation is the fusion of the male and female reproductive cells.',rubric:['Male reproductive cell','Female reproductive cell','The two reproductive cells fuse','This process is fertilisation'],modelApplicationAnswer:'Fertilisation occurs when the male reproductive cell fuses with the female reproductive cell. After fertilisation, a seed can develop.'},
      18:{phrase:'The young and adult are stages in the same life cycle and belong to the same kind of organism, although they may differ in size or appearance.',rubric:['Young and adult are stages of the same life cycle','They belong to the same kind of organism','They may differ in size or appearance'],modelApplicationAnswer:'The young frog and adult frog are stages in the same life cycle and belong to the same kind of organism, although they differ in appearance.'},
      23:{phrase:'Blood transports water, oxygen, digested food, carbon dioxide and waste materials around the body.',rubric:['Blood transports water','Blood transports oxygen and digested food','Blood transports carbon dioxide and waste materials','These substances are transported around the body'],modelApplicationAnswer:'Blood transports water, oxygen, digested food, carbon dioxide and waste materials around the body.'},
      25:{phrase:'During exercise, more energy is needed, so respiration occurs faster. Breathing rate increases to take in more oxygen and give out carbon dioxide faster.',rubric:['More energy is needed during exercise','Respiration occurs faster','Breathing rate increases','More oxygen is taken in and carbon dioxide is given out faster'],modelApplicationAnswer:'During exercise, Amir needs more energy, so respiration occurs faster. His breathing rate increases to take in more oxygen and give out carbon dioxide faster.'},
      26:{phrase:'The heart beats faster during exercise to transport more oxygen and digested food to the muscles and remove carbon dioxide and waste materials more quickly.',rubric:['Heart beats faster','More oxygen and digested food reach the muscles','Carbon dioxide and waste materials are removed more quickly'],modelApplicationAnswer:'Mei’s heart beats faster during exercise to transport more oxygen and digested food to her muscles and remove carbon dioxide and waste materials more quickly.'},
      29:{phrase:'Respiration is the breaking down of glucose or sugar with the release of energy in living cells.',rubric:['Glucose or sugar is broken down','Energy is released','Respiration takes place in living cells'],modelApplicationAnswer:'Respiration is the breaking down of glucose or sugar with the release of energy in living cells. The released energy is used for life processes.'},
      34:{phrase:'Organisms compete when they need the same resources, such as food, water, sunlight, mineral salts or space.',rubric:['Organisms need the same resources','The resources are limited in the situation','Examples include food, water, sunlight, mineral salts or space'],modelApplicationAnswer:'The seedlings need the same resources and therefore compete for water, sunlight, mineral salts and space. Some seedlings may receive less of these resources and grow less well.'},
      40:{phrase:'Gas is matter because it has mass and occupies space.',rubric:['Gas has mass','Gas occupies space','Therefore gas is matter'],modelApplicationAnswer:'The trapped air has mass and occupies space. Therefore, air is matter.'},
      41:{phrase:'A gas has no definite volume and can be compressed.',rubric:['Air is a gas','Gas has no definite volume','Gas can be compressed'],modelApplicationAnswer:'The air in the sealed syringe is a gas. A gas has no definite volume and can be compressed, so the plunger can be pushed in slightly.'},
      42:{phrase:'A solid has a definite shape and a definite volume.',rubric:['The object is a solid','A solid has a definite shape','A solid has a definite volume'],modelApplicationAnswer:'The wooden block is a solid. A solid has a definite shape and a definite volume, so it keeps its shape when moved into another container.'},
      43:{phrase:'A liquid has no definite shape but has a definite volume, and takes the shape of its container.',rubric:['Liquid has no definite shape','Liquid has a definite volume','Liquid takes the shape of its container'],modelApplicationAnswer:'Water is a liquid. A liquid has no definite shape but has a definite volume, so the water takes the shape of the bowl.'},
      44:{phrase:'During evaporation, water at the surface gains heat and changes from liquid water to water vapour. Evaporation can occur at any temperature.',rubric:['Evaporation takes place at the surface','Water gains heat','Liquid water changes to water vapour','Evaporation can occur at any temperature'],modelApplicationAnswer:'Water at the surface gained heat from the surroundings and changed from liquid water to water vapour by evaporation. Evaporation can occur at any temperature, so the water level decreased without boiling.'},
      45:{phrase:'At a higher temperature, water gains heat more quickly, so the rate of evaporation is higher.',rubric:['Cloth A is at a higher temperature','Water gains heat more quickly','The rate of evaporation is higher','Cloth A dries faster'],modelApplicationAnswer:'Cloth A was at a higher temperature, so the water in it gained heat more quickly and the rate of evaporation was higher. Therefore, Cloth A dried faster.'},
      50:{phrase:'Melting is the change in state from solid to liquid at a fixed temperature due to heat gain.',rubric:['Solid gains heat','Changes from solid to liquid','Melting occurs at a fixed temperature'],modelApplicationAnswer:'The ice gained heat from the surroundings and melted, changing from a solid to a liquid at its melting point.'},
      51:{phrase:'Freezing is the change in state from liquid to solid at a fixed temperature due to heat loss.',rubric:['Liquid loses heat','Changes from liquid to solid','Freezing occurs at a fixed temperature'],modelApplicationAnswer:'The water lost heat in the freezer and froze, changing from a liquid to a solid at its freezing point.'},
      52:{phrase:'Boiling is the change in state from liquid to gas at a fixed temperature due to heat gain, and takes place throughout the liquid.',rubric:['Liquid gains heat','Changes from liquid to gas','Boiling occurs at a fixed temperature','Boiling takes place throughout the liquid'],modelApplicationAnswer:'The water gained heat and boiled. Boiling is the change from liquid to gas at a fixed temperature and takes place throughout the liquid, so bubbles formed throughout the water.'},
      53:{phrase:'The water cycle is the continuous movement of water from Earth to the sky and back to Earth through evaporation, condensation and precipitation.',rubric:['Water cycle is continuous','Water moves from Earth to the sky and back','Evaporation','Condensation','Precipitation'],modelApplicationAnswer:'Water evaporated from the puddle into water vapour. The water vapour later lost heat and condensed into tiny water droplets in clouds before returning to Earth as rain. This is part of the continuous water cycle.'},
      62:{phrase:'A shadow is formed when light from a light source is partially or completely blocked by an object.',rubric:['Light comes from a light source','An object blocks the light partially or completely','A shadow is formed'],modelApplicationAnswer:'Light from the lamp was blocked by the cardboard cut-out, so light could not reach part of the screen and a shadow was formed.'},
      63:{phrase:'When an object is nearer to the light source or farther from the screen, its shadow becomes bigger.',rubric:['Object is nearer the light source or farther from the screen','The shadow becomes bigger'],modelApplicationAnswer:'The toy was moved nearer to the light source while the screen stayed in the same position. Therefore, its shadow became bigger.'},
      71:{phrase:'Electrical insulators do not allow electric current to flow through them.',rubric:['Plastic is an electrical insulator','Electrical insulators do not allow electric current to flow through them','The bulb does not light'],modelApplicationAnswer:'Plastic is an electrical insulator and does not allow electric current to flow through it, so the bulb does not light.'},
      72:{phrase:'Increasing the number of batteries connected in series increases the electric current, causing the bulb to shine more brightly.',rubric:['More batteries are connected in series','More electric current flows','The bulb shines more brightly'],modelApplicationAnswer:'With an additional battery connected in series, more electric current flowed through the circuit, causing the bulb to shine more brightly.'},
      73:{phrase:'When more bulbs are connected in series, less electric current flows through each bulb, so each bulb is dimmer.',rubric:['More bulbs are connected in series','Less electric current flows through each bulb','Each bulb becomes dimmer'],modelApplicationAnswer:'With more bulbs connected in series, less electric current flowed through each bulb, so each bulb was dimmer.'},
      77:{phrase:'A force can make an object start moving, stop moving, speed up, slow down, change direction or change shape.',rubric:['A force is applied','A force can change motion','A force can also change shape'],modelApplicationAnswer:'The kick applied a force to the stationary ball, causing it to start moving. This shows that a force can change the motion of an object.'},
      81:{phrase:'Gravitational force is the pull that Earth exerts on objects towards the centre of Earth.',rubric:['Earth exerts gravitational force','It is a pull','It acts towards the centre of Earth'],modelApplicationAnswer:'Earth exerts a gravitational force on the ball, pulling it towards the centre of Earth, so the ball falls.'},
      84:{applicationQuestion:'Two identical balls are shown. Ball A is moving while Ball B is stationary. Which ball has kinetic energy due to motion? Explain.'},
      89:{phrase:'Energy cannot be created or destroyed; it can be converted from one form to another.',rubric:['Energy cannot be created','Energy cannot be destroyed','Energy can be converted from one form to another'],modelApplicationAnswer:'The car’s kinetic energy did not disappear. Energy cannot be created or destroyed; it was converted into other forms such as heat and sound as the car slowed down.'}
    };

    const inject=`BANK.push(...${JSON.stringify(EXPERIMENT_BANK)});\nconst GOLD_OVERRIDES=${JSON.stringify(GOLD_OVERRIDES)};\nObject.entries(GOLD_OVERRIDES).forEach(([id,patch])=>Object.assign(BANK[Number(id)-1],patch));\n`;
    html=html.replace('const KEY=',inject+'const KEY=');

    html=html.replaceAll('Array(89).keys()','Array(BANK.length).keys()');
    html=html.replaceAll('for(let i=0;i<89;i++)','for(let i=0;i<BANK.length;i++)');
    html=html.replaceAll('ps/89*100','ps/BANK.length*100');
    html=html.replaceAll('as/89*100','as/BANK.length*100');
    html=html.replace('bank:89','bank:BANK.length');
    html=html.replace('psle-science-89-structured-progress.json','psle-science-97-structured-progress.json');
    html=html.replace('PSLE Science Structured Mastery — 89','PSLE Science Structured Mastery — 97');
    html=html.replace('89 concepts · VERBATIM phrase mastery + application · weak concepts recur more often','97 gold-standard patterns · 89 Science explanations + 8 experiment frameworks · memorisation + application');
    html=html.replaceAll('All 89','All 97');
    html=html.replace('id="amberCount">89','id="amberCount">97');
    html=html.replace('Type the VERBATIM 89-bank explanation here...','Type the VERBATIM gold-standard sentence/framework here...');
    html=html.replace('the target sentence is copied VERBATIM from the original 89-bank HTML.','the target sentence/framework is learned VERBATIM from the gold-standard revision bank.');
    html=html.replace('core 89-bank explanation is never rewritten','gold-standard memorised Science explanation is kept as the S/R core');
    html=html.replace('Existing progress from the earlier 89-item trainers is migrated automatically when available.','Existing progress is preserved. Where a memorised sentence changed to the gold-standard wording, the old recall dates are archived and that sentence is re-mastered.');

    html=html.replace('</body>','<script src="enhancements.js?v=gold-book-v1"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div><b>Could not load the trainer.</b><br>'+String(err.message||err)+'</div></div>';
  }
})();
</script>
</body>
</html>
