<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Structured Mastery</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033}
#trainerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f4f7fbcc}
#bootCard{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px 22px;box-shadow:0 8px 30px #0f172a18;text-align:center;line-height:1.5;min-width:min(420px,calc(100vw - 32px))}
#bootMsg{font-weight:800}.small{font-size:12px;color:#64748b;margin-top:4px}#errorBox{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#fef2f2;color:#991b1b;font-size:12px;text-align:left}
</style>
</head>
<body>
<iframe id="trainerFrame" title="PSLE Science Structured Mastery"></iframe>
<div id="boot"><div id="bootCard"><div id="bootMsg">Loading Science trainer…</div><div class="small">Core trainer + Flashcards first</div><div id="errorBox"></div></div></div>
<script>
(async()=>{
 const student=(localStorage.getItem('psleScience_active_student')||'').toLowerCase();
 if(!['jerry','javis'].includes(student)){location.replace('signin.html');return}
 const frame=document.getElementById('trainerFrame'),boot=document.getElementById('boot'),msg=document.getElementById('bootMsg'),errBox=document.getElementById('errorBox');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const waitFor=(fn,ms=7000)=>new Promise(resolve=>{const start=Date.now();const tick=()=>{let ok=false;try{ok=!!fn()}catch(_e){}if(ok)return resolve(true);if(Date.now()-start>=ms)return resolve(false);setTimeout(tick,80)};tick()});
 const loadScript=(doc,src,critical=false)=>new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.async=false;s.onload=()=>resolve(true);s.onerror=()=>critical?reject(new Error('Could not load '+src)):resolve(false);doc.head.appendChild(s)});
 const fail=e=>{console.error(e);msg.textContent='Could not initialise the trainer';errBox.style.display='block';errBox.textContent=String(e&&e.message?e.message:e)};

 frame.src='trainer180.html?v=20260906s';
 frame.addEventListener('load',async()=>{
  try{
   const w=frame.contentWindow,d=frame.contentDocument;
   msg.textContent='Loading core controls…';
   const coreReady=await waitFor(()=>w.eval('typeof BANK!=="undefined" && Array.isArray(BANK) && BANK.length===180 && typeof rec==="function" && typeof save==="function" && typeof buildQueue==="function"'));
   if(!coreReady)throw new Error('The 180-concept core trainer did not finish loading.');

   await loadScript(d,'resources/profile-storage.js?v=20260906s',true);
   try{w.eval('S=loadState(); save(); buildQueue(); setPane("phrase");')}catch(e){throw new Error('Could not restore this pupil\'s saved progress: '+e.message)}

   try{
    const q=d.getElementById('queueMode');if(q){[...q.options].forEach(o=>{if(o.value==='red')o.textContent='🔴 Focus only';if(o.value==='amber')o.textContent='⚪ Not Studied Yet only';if(o.value==='green')o.textContent='🟢 Already Good only';if(o.value==='all')o.textContent='All 180'})}
    const a=d.getElementById('markAuto');if(a)a.textContent='⚪ Not Studied Yet';
    const g=d.getElementById('markGood');if(g)g.textContent='🟢 Already Good';
    const amber=d.querySelector('#amberCount')?.previousElementSibling;if(amber)amber.textContent='⚪ Not Studied Yet';
   }catch(_e){}

   msg.textContent='Loading Flashcards…';
   await loadScript(d,'resources/flashcards-stable.js?v=20260906s',true);
   try{if(typeof w.PSLE_INSTALL_FLASHCARDS==='function')w.PSLE_INSTALL_FLASHCARDS()}catch(_e){}
   const flashReady=await waitFor(()=>d.getElementById('flashcardTab')&&d.getElementById('flashcardPanel'),5000);
   if(!flashReady)throw new Error('Flashcards could not be added.');

   msg.textContent='Ready ✓';await sleep(100);boot.style.display='none';

   // Application is deliberately lightweight: no 22-file audit/variant stack.
   // On first use we load only the compact question engine, PSLE-style question bank,
   // AI marker and a bounded question-family UI. This prevents synchronous loops and
   // long script bursts that previously made Chrome report "Page Unresponsive".
   let appState='idle';
   async function loadApplication(){
    if(appState==='ready'||appState==='loading')return;
    appState='loading';
    const badge=d.createElement('div');badge.id='appEnhanceStatus';badge.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;padding:8px 11px;border-radius:10px;background:#172033;color:#fff;font:700 12px Arial;box-shadow:0 4px 18px #0003';badge.textContent='Preparing Application questions…';d.body.appendChild(badge);
    try{
     const files=[
      'resources/appvariants/engine.js?v=20260906s',
      'resources/psle-style-questions.js?v=20260906s',
      'resources/ai-marker.js?v=20260906s',
      'resources/application-lite-ui.js?v=20260906s'
     ];
     for(const src of files){await loadScript(d,src,true);await sleep(60)}
     try{w.eval('render();')}catch(_e){}
     appState='ready';badge.textContent='Application ready ✓';setTimeout(()=>badge.remove(),800);
    }catch(e){appState='failed';badge.textContent='Application extras failed — basic mode still works';badge.style.background='#991b1b';console.error(e);setTimeout(()=>badge.remove(),3500)}
   }
   d.getElementById('appTab')?.addEventListener('click',loadApplication,{once:true});
  }catch(e){fail(e)}
 },{once:true});
})();
</script>
</body>
</html>
