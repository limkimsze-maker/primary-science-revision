<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSLE Science Structured Mastery</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033}
#trainerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f4f7fbcc}
#bootCard{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px 22px;box-shadow:0 8px 30px #0f172a18;text-align:center;line-height:1.5;min-width:min(420px,calc(100vw - 32px))}
#bootMsg{font-weight:800}.small{font-size:12px;color:#64748b;margin-top:4px}#errorBox{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#fef2f2;color:#991b1b;font-size:12px;text-align:left}
#switchStudent{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:99998;border:1px solid #cbd5e1;border-radius:11px;background:#fff;color:#475569;padding:8px 11px;font:800 12px Arial;box-shadow:0 4px 14px #0f172a18;cursor:pointer}#switchStudent:hover{background:#f8fafc}
@media(max-width:700px){#switchStudent{top:max(6px,env(safe-area-inset-top));right:max(7px,env(safe-area-inset-right));padding:7px 9px;font-size:11px}}
</style>
</head>
<body>
<iframe id="trainerFrame" title="PSLE Science Structured Mastery"></iframe>
<button id="switchStudent" type="button">👤 Jerry / Javis</button>
<div id="boot"><div id="bootCard"><div id="bootMsg">Loading Science trainer…</div><div class="small">192 items · Recall → Memorise → Apply</div><div id="errorBox"></div></div></div>
<script>
(async()=>{
 const V='20260908b';
 document.getElementById('switchStudent').onclick=()=>location.replace('signin.html?v='+V);
 const student=(localStorage.getItem('psleScience_active_student')||'').toLowerCase();
 if(!['jerry','javis'].includes(student)){location.replace('signin.html?v='+V);return}
 const frame=document.getElementById('trainerFrame'),boot=document.getElementById('boot'),msg=document.getElementById('bootMsg'),errBox=document.getElementById('errorBox');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const waitFor=(fn,ms=8000)=>new Promise(resolve=>{const start=Date.now();const tick=()=>{let ok=false;try{ok=!!fn()}catch(_e){}if(ok)return resolve(true);if(Date.now()-start>=ms)return resolve(false);setTimeout(tick,80)};tick()});
 const loadScript=(doc,src,critical=false)=>new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.async=false;s.onload=()=>resolve(true);s.onerror=()=>critical?reject(new Error('Could not load '+src)):resolve(false);doc.head.appendChild(s)});
 const preload=(doc,src)=>{try{const l=doc.createElement('link');l.rel='preload';l.as='script';l.href=src;doc.head.appendChild(l)}catch(_e){}};
 const fail=e=>{console.error(e);msg.textContent='Could not initialise the trainer';errBox.style.display='block';errBox.textContent=String(e&&e.message?e.message:e)};

 frame.src='trainer180.html?v='+V;
 frame.addEventListener('load',async()=>{
  try{
   const w=frame.contentWindow,d=frame.contentDocument;
   msg.textContent='Loading core controls…';
   const coreReady=await waitFor(()=>w.eval('typeof BANK!=="undefined" && Array.isArray(BANK) && BANK.length===180 && typeof rec==="function" && typeof save==="function" && typeof buildQueue==="function"'));
   if(!coreReady)throw new Error('The 180-concept core trainer did not finish loading.');

   await loadScript(d,'resources/profile-storage.js?v='+V,true);
   try{w.eval('S=loadState(); save(); buildQueue(); setPane("phrase");')}catch(e){throw new Error('Could not restore saved progress: '+e.message)}

   msg.textContent='Loading 180 concepts + 12 Process Skills…';
   await loadScript(d,'resources/process-skills.js?v='+V,true);
   await loadScript(d,'resources/flashcards-stable.js?v='+V,true);
   try{if(typeof w.PSLE_INSTALL_FLASHCARDS==='function')w.PSLE_INSTALL_FLASHCARDS()}catch(_e){}
   await loadScript(d,'resources/flashcard-speech-rescue.js?v='+V,false);

   const variantFiles=[
    'resources/appvariants/01-diversity-classification.js?v='+V,
    'resources/appvariants/02-plant-structures-functions.js?v='+V,
    'resources/appvariants/03-life-cycles-reproduction.js?v='+V,
    'resources/appvariants/04-human-animal-systems.js?v='+V,
    'resources/appvariants/05-plant-transport-photosynthesis-respiration.js?v='+V,
    'resources/appvariants/06-ecology-adaptations-environment.js?v='+V,
    'resources/appvariants/07-matter-materials-changes-of-state.js?v='+V,
    'resources/appvariants/08-light.js?v='+V,
    'resources/appvariants/09-heat-thermal-expansion.js?v='+V,
    'resources/appvariants/10-electricity-electromagnets-magnets.js?v='+V,
    'resources/appvariants/11-energy-forces.js?v='+V
   ];
   const appCore=['resources/appvariants/engine.js?v='+V,'resources/ai-fetch-retry.js?v='+V,'resources/ai-marker.js?v='+V,'resources/application-lite-ui.js?v='+V];
   setTimeout(()=>[...variantFiles,...appCore].forEach(src=>preload(d,src)),200);

   let appState='idle';
   async function loadApplication(){
    if(appState==='ready'||appState==='loading')return;
    appState='loading';
    const badge=d.createElement('div');badge.id='appEnhanceStatus';badge.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;padding:8px 11px;border-radius:10px;background:#172033;color:#fff;font:700 12px Arial;box-shadow:0 4px 18px #0003';badge.textContent='Preparing one Application question…';d.body.appendChild(badge);
    try{
     await Promise.all(variantFiles.map(src=>loadScript(d,src,true)));
     await loadScript(d,'resources/appvariants/engine.js?v='+V,true);
     await loadScript(d,'resources/ai-fetch-retry.js?v='+V,true);
     await Promise.all([loadScript(d,'resources/ai-marker.js?v='+V,true),loadScript(d,'resources/application-lite-ui.js?v='+V,true)]);
     try{w.eval('render();')}catch(_e){}
     appState='ready';badge.textContent='Application ready ✓';setTimeout(()=>badge.remove(),450);
    }catch(e){appState='failed';badge.textContent='Application tools failed to load';badge.style.background='#991b1b';console.error(e);setTimeout(()=>badge.remove(),3500)}
   }
   d.getElementById('appTab')?.addEventListener('click',loadApplication,{once:true});

   await loadScript(d,'resources/guided-concept-flow-v5.js?v='+V,true);
   if(!await waitFor(()=>d.getElementById('guidedFlow'),5000))throw new Error('The guided study path did not initialise.');
   await loadScript(d,'resources/guided-flow-flip-speech.js?v='+V,true);
   await loadScript(d,'resources/memorise-mistake-feedback.js?v='+V,true);
   await loadScript(d,'resources/guided-process-merge.js?v='+V,true);
   if(!await waitFor(()=>w.PSLE_PROCESS_MERGE,5000))throw new Error('Process Skills did not merge into the study path.');
   await loadScript(d,'resources/guided-progress-sidebar.js?v='+V,true);
   await loadScript(d,'resources/revisit-known-anytime.js?v='+V,true);
   await loadScript(d,'resources/motivation-layer.js?v='+V,true);
   await loadScript(d,'resources/universal-display.js?v='+V,true);
   msg.textContent='Ready ✓';await sleep(100);boot.style.display='none';
  }catch(e){fail(e)}
 },{once:true});
})();
</script>
</body>
</html>
