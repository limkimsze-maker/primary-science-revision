<script>
(async()=>{
 try{
  const res=await fetch('trainer180.html?v=20260904a',{cache:'no-cache'});
  if(!res.ok)throw new Error('Could not load trainer180.html');
  let html=await res.text();
  const files=[
   '01-diversity-classification.js','02-plant-structures-functions.js','03-life-cycles-reproduction.js',
   '04-human-animal-systems.js','05-plant-transport-photosynthesis-respiration.js','06-ecology-adaptations-environment.js',

   '10-electricity-electromagnets-magnets.js','11-energy-forces.js','engine.js'
  ];
  const tags=files.map(f=>`<script src="resources/appvariants/${f}?v=20260904d"><\/script>`).join('');
  html=html.replace('</body>',tags+'</body>');
  document.open();document.write(html);document.close();
 }catch(err){
  document.body.innerHTML='<div class="loading"><div><b>Could not load the trainer.</b><br>'+String(err.message||err)+'</div></div>';
 }
})();
</script>
