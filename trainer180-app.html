<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Structured Mastery</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033}
#trainerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f4f7fbcc;backdrop-filter:blur(2px)}
#bootCard{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px 22px;box-shadow:0 8px 30px #0f172a18;text-align:center;line-height:1.5;min-width:min(420px,calc(100vw - 32px))}
#bootMsg{font-weight:800}.small{font-size:12px;color:#64748b;margin-top:4px}
#errorBox{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#fef2f2;color:#991b1b;font-size:12px;text-align:left}
</style>
</head>
<body>
<iframe id="trainerFrame" title="PSLE Science Structured Mastery"></iframe>
<div id="boot"><div id="bootCard"><div id="bootMsg">Loading Science trainer…</div><div class="small">Core trainer first · Flashcards next · heavier application tools only when needed</div><div id="errorBox"></div></div></div>
<script>
(async()=>{
 const student=(localStorage.getItem('psleScience_active_student')||'').toLowerCase();
 if(!['jerry','javis'].includes(student)){location.replace('signin.html');return}
 const frame=document.getElementById('trainerFrame'),boot=document.getElementById('boot'),msg=document.getElementById('bootMsg'),errBox=document.getElementById('errorBox');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
 const waitFor=(fn,ms=6000)=>new Promise(resolve=>{const start=Date.now();const tick=()=>{let ok=false;try{ok=!!fn()}catch(_e){}if(ok)return resolve(true);if(Date.now()-start>=ms)return resolve(false);setTimeout(tick,80)};tick()});
 const loadScript=(doc,src,critical=false)=>new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.async=false;s.onload=()=>resolve(true);s.onerror=()=>critical?reject(new Error('Could not load '+src)):resolve(false);doc.head.appendChild(s)});
 const fail=e=>{console.error(e);msg.textContent='Could not initialise the trainer';errBox.style.display='block';errBox.textContent=String(e&&e.message?e.message:e)};

 frame.src='trainer180.html?v=20260906r';
 frame.addEventListener('load',async()=>{
  try{
   const w=frame.contentWindow,d=frame.contentDocument;
   msg.textContent='Loading core controls…';
   const coreReady=await waitFor(()=>w.eval('typeof BANK!=="undefined" && Array.isArray(BANK) && BANK.length===180 && typeof rec==="function" && typeof save==="function" && typeof buildQueue==="function"'),7000);
   if(!coreReady)throw new Error('The 180-concept core trainer did not finish loading.');

   await loadScript(d,'resources/profile-storage.js?v=20260906r',true);
   try{w.eval('S=loadState(); save(); buildQueue(); setPane("phrase");')}catch(e){throw new Error('Could not restore this pupil\'s saved progress: '+e.message)}

   try{
    const q=d.getElementById('queueMode');if(q){[...q.options].forEach(o=>{if(o.value==='red')o.textContent='🔴 Focus only';if(o.value==='amber')o.textContent='⚪ Not Studied Yet only';if(o.value==='green')o.textContent='🟢 Already Good only';if(o.value==='all')o.textContent='All 180'})}
    const a=d.getElementById('markAuto');if(a)a.textContent='⚪ Not Studied Yet';
    const g=d.getElementById('markGood');if(g)g.textContent='🟢 Already Good';
    const amber=d.querySelector('#amberCount')?.previousElementSibling;if(amber)amber.textContent='⚪ Not Studied Yet';
   }catch(_e){}

   msg.textContent='Loading Flashcards…';
   await loadScript(d,'resources/flashcards-stable.js?v=20260906r',true);
   try{if(typeof w.PSLE_INSTALL_FLASHCARDS==='function')w.PSLE_INSTALL_FLASHCARDS()}catch(_e){}
   const flashReady=await waitFor(()=>d.getElementById('flashcardTab')&&d.getElementById('flashcardPanel'),5000);
   if(!flashReady)throw new Error('Flashcards could not be added.');

   msg.textContent='Flashcards ready ✓';
   await sleep(120);boot.style.display='none';

   // Do NOT load the large application/audit stack in the background. It was making
   // Chrome busy while the pupil was trying to use Flashcards. Load it only when the
   // pupil actually enters Written Application.
   let enhancementsState='idle';
   async function loadEnhancements(){
    if(enhancementsState!=='idle')return;
    enhancementsState='loading';
    const badge=d.createElement('div');badge.id='appEnhanceStatus';badge.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;padding:8px 11px;border-radius:10px;background:#172033;color:#fff;font:700 12px Arial;box-shadow:0 4px 18px #0003';badge.textContent='Loading enhanced Application tools…';d.body.appendChild(badge);
    try{
     const appFiles=['01-diversity-classification.js','02-plant-structures-functions.js','03-life-cycles-reproduction.js','04-human-animal-systems.js','05-plant-transport-photosynthesis-respiration.js','06-ecology-adaptations-environment.js','07-matter-materials-changes-of-state.js','08-light.js','09-heat-thermal-expansion.js','10-electricity-electromagnets-magnets.js','11-energy-forces.js'];
     const files=[];
     appFiles.forEach(f=>files.push('resources/appvariants/'+f+'?v=20260906r'));
     files.push('resources/audit180/core.js?v=20260906r');
     appFiles.forEach(f=>files.push('resources/audit180/'+f+'?v=20260906r'));
     files.push(
      'resources/appvariants/engine.js?v=20260906r',
      'resources/psle-style-questions.js?v=20260906r',
      'resources/priority-colors.js?v=20260906r',
      'resources/filter-position.js?v=20260906r',
      'resources/ai-marker.js?v=20260906r',
      'resources/memorisation-flow.js?v=20260906r',
      'resources/answer-normalization.js?v=20260906r',
      'resources/check-next.js?v=20260906r',
      'resources/learning-cycle.js?v=20260906r',
      'resources/application-answer-ui.js?v=20260906r'
     );
     for(let i=0;i<files.length;i++){
      await loadScript(d,files[i],false);
      // Give Chrome a rendering opportunity after every file. This keeps the tab
      // responsive instead of executing the entire enhancement stack in one burst.
      await nextFrame();
      if(i%5===4)await sleep(25);
     }
     enhancementsState='ready';badge.textContent='Application tools ready ✓';setTimeout(()=>badge.remove(),900);
    }catch(e){
     enhancementsState='failed';badge.textContent='Application extras could not load — basic mode still works';badge.style.background='#991b1b';console.error(e);setTimeout(()=>badge.remove(),3500);
    }
   }
   d.getElementById('appTab')?.addEventListener('click',()=>{loadEnhancements()},{once:true});
  }catch(e){fail(e)}
 },{once:true});
})();
</script>
</body>
</html>
