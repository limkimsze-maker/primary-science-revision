(async()=>{
 try{

  if(!res.ok)throw new Error('Could not load trainer180.html');
  let html=await res.text();
  const appFiles=[
   '01-diversity-classification.js','02-plant-structures-functions.js','03-life-cycles-reproduction.js',
   '04-human-animal-systems.js','05-plant-transport-photosynthesis-respiration.js','06-ecology-adaptations-environment.js',
   '07-matter-materials-changes-of-state.js','08-light.js','09-heat-thermal-expansion.js',
   '10-electricity-electromagnets-magnets.js','11-energy-forces.js'
  ];
  const auditFiles=[
   '01-diversity-classification.js','02-plant-structures-functions.js','03-life-cycles-reproduction.js',
   '04-human-animal-systems.js','05-plant-transport-photosynthesis-respiration.js','06-ecology-adaptations-environment.js',
   '07-matter-materials-changes-of-state.js','08-light.js','09-heat-thermal-expansion.js',
   '10-electricity-electromagnets-magnets.js','11-energy-forces.js'
  ];
  const scripts=[];
  appFiles.forEach(f=>scripts.push(`resources/appvariants/${f}?v=20260905d`));
  scripts.push('resources/audit180/core.js?v=20260905d');
  auditFiles.forEach(f=>scripts.push(`resources/audit180/${f}?v=20260905d`));

  scripts.push('resources/ai-marker.js?v=20260905d');
  const tags=scripts.map(src=>`<script src="${src}"><\/script>`).join('');
  html=html.replace('</body>',tags+'</body>');
  document.open();document.write(html);document.close();
 }catch(err){
  document.body.innerHTML='<div class="loading"><div><b>Could not load the trainer.</b><br>'+String(err.message||err)+'</div></div>';
 }
})();
</script>
